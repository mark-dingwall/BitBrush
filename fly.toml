app = "bitbrush"
primary_region = "syd"

[build]

[deploy]
  strategy = "immediate"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  # Provision PIN_PEPPER with Fly secrets before deployment; prod startup requires it.
  # Enable PIN_BACKFILL_EXPORT_PATH only for the protected legacy export workflow.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    port = 8080
    type = "http"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
