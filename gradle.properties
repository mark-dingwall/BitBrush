# Keep the build daemon small enough to coexist with the opt-in calibration JVM
# inside the documented 512 MiB container. Production application memory is unchanged.
org.gradle.jvmargs=-Xmx192m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=48m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC -Dfile.encoding=UTF-8
