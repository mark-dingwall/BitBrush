# --- H2 Database (in-memory, fresh each run) ---
spring.datasource.url=jdbc:h2:mem:bitbrush-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# --- Logging ---
logging.level.au.com.dingwall.mark.bitbrush=DEBUG

# --- PIN credentials (test-only pepper: Base64 for 32 zero bytes) ---
pin.pepper=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
pin.memory-kib=32
pin.iterations=1
pin.parallelism=1
pin.hash-length=16
pin.max-concurrent=1
pin.retry-after-seconds=1
pin.recovery-window=15m
pin.account-limit=5
pin.ip-limit=20
pin.account-capacity=10000
pin.ip-capacity=10000
