# --- Production Profile ---
# Activated by: SPRING_PROFILES_ACTIVE=prod (in fly.toml)
# Purpose: Production deployment on fly.io with PostgreSQL.

# --- PostgreSQL Database ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# Flyway owns schema creation/evolution; Hibernate only validates entities match.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.placeholders.pin-pepper=${PIN_PEPPER}

# --- H2 Console (disabled) ---
spring.h2.console.enabled=false

# --- Logging ---
# Spring 6.2 logs credential-bearing STOMP headers and Principals below INFO.
# Operator overrides lowering these categories are unsupported security configuration.
logging.level.org.springframework.messaging.simp=INFO
logging.level.org.springframework.web.socket.messaging=INFO
logging.level.org.springframework.web.SimpLogging=INFO
logging.level.root=INFO

# --- Actuator (minimal in prod) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- PIN credentials ---
pin.pepper=${PIN_PEPPER}
pin.memory-kib=19456
pin.iterations=2
pin.parallelism=1
pin.hash-length=32
pin.max-concurrent=2
pin.retry-after-seconds=1
pin.recovery-window=15m
pin.account-limit=5
pin.ip-limit=20
pin.account-capacity=10000
pin.ip-capacity=10000
pin.backfill-export-path=${PIN_BACKFILL_EXPORT_PATH:}
