services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bitbrush_ci
      POSTGRES_USER: bitbrush_ci
      POSTGRES_PASSWORD: ${CI_DATABASE_PASSWORD:?generated fixture password required}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - disposable-db:/var/lib/postgresql/data
  app:
    image: ${BITBRUSH_TEST_IMAGE:?tested image required}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/bitbrush_ci
      DATABASE_USERNAME: bitbrush_ci
      DATABASE_PASSWORD: ${CI_DATABASE_PASSWORD}
      PIN_PEPPER: ${CI_PIN_PEPPER:?generated test pepper required}
      # Official Cloudflare test secret: only in this disposable runtime.
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      PIN_BACKFILL_EXPORT_PATH: ''
  proxy:
    image: nginx:1.28-alpine
    depends_on:
      - app
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  disposable-db:
